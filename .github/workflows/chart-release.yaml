name: Release chart
on:
  push:
    tags:
      - chart/v*
permissions:
  contents: write
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yaml
  chart:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/reprise
      - run: cmp config/crd/reprise.naji-dev.de_repriserequests.yaml charts/reprise/files/reprise.naji-dev.de_repriserequests.yaml
      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#chart/v}"
          test "$(helm show chart charts/reprise | awk '/^version:/ {print $2}')" = "$version"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/reprise --destination /tmp
          helm push "/tmp/reprise-$version.tgz" oci://ghcr.io/rejinka/charts
          gh release create "$TAG" \
            config/crd/reprise.naji-dev.de_repriserequests.yaml \
            --title "Reprise chart $version" --generate-notes
