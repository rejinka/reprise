replicaCount: 1
image:
  repository: ghcr.io/rejinka/reprise
  tag: "v0.1.0"
  pullPolicy: IfNotPresent
crds:
  enabled: true
  keep: true
serviceAccount:
  create: true
  name: ""
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
# Explicit opt-in. These rules are appended to a cluster-wide ClusterRole.
# For namespace-limited access, create separate Roles and RoleBindings instead.
# See README.md for expanded examples.
targetRules: []
podReadiness:
  enabled: true
